<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Rewritten at serve time from DISPATCH_BASE_PATH. Keep on one line: the daemon
         matches this exact attribute. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F11" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": with a translucent bar the page runs under the
         status bar, and iOS 26 paints its scroll-edge blur/gradient over our header there.
         With an opaque bar, the page starts below it and safe-area-inset-top becomes 0.
         iOS reads this when the app is added to the Home Screen, so re-add it to see the change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Dispatch" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Painted before any stylesheet or script arrives, so a launch never flashes. theme-boot.js
         first writes the saved theme's colors (Settings > Appearance > Theme) onto <html>; with no
         saved theme, this is Dispatch Dark's canvas. -->
    <script src="theme-boot.js"></script>
    <style>html,body{background:var(--color-canvas,#08080A);color-scheme:dark}</style>
    <title>Dispatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
