# Codex's system config on a hosted box (/etc/codex/config.toml): the defaults below every other layer.
# A thread's own model pick, a person's or an agent's own ~/.codex/config.toml and a -c flag all win over
# it; Codex's requirements have no key that pins a model, so this is a default, not a rule.
# The default model (the owner, 2026-11-13): GPT-6.1 Sol. The daemon sends the same for a Dispatch thread
# with no pick (structured/codex-fast.ts hostedCodexDefaultModel).
model = "gpt-6.1-sol"
